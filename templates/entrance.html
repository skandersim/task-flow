{% extends 'base.html' %}

{% block title %}Вход | TaskFlow{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='registration.css') }}">
{% endblock %}

{% block main_content %}
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Вход</h1>
            </div>

            <form class="auth-form" action="/entrance" method="POST">
                <div class="field-block">
                    <label class="field-label">Ваш логин или почта</label>
                    <div class="input-group">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" name="login" placeholder="Введите ваш @Логин или почту" required>
                    </div>
                </div>

                <div class="field-block">
                    <label class="field-label">Пароль</label>
                    <div class="input-group">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" name="password" placeholder="Введите пароль от аккаунта" required>
                        <button type="button" class="toggle-password input-action-icon">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                
                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}

                <button type="submit" class="btn btn-primary btn-full">Войти</button>
            </form>

            <div class="auth-divider">или</div>

            <div class="auth-footer-text">
                Ещё нет аккаунта? <a href="/register">Регистрация</a>
            </div>
        </div>
    </div>
{% endblock %}
{% block extra_js %}
    <script src="{{ url_for('static', filename='javaScript/auth.js') }}"></script>
{% endblock %}
